spring:
  application:
    name: safecity-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safecity_db}
    username: ${SPRING_DATASOURCE_USERNAME:safecity_user}
    password: ${SPRING_DATASOURCE_PASSWORD:safecity_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "format_sql": true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/safecity}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/safecity}/protocol/openid-connect/certs

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

  email-api:
    provider: ${EMAIL_API_PROVIDER:${SPRING_EMAIL_API_PROVIDER:mailgun}}
    api-key: ${EMAIL_API_KEY:${SPRING_EMAIL_API_API_KEY:}}
    api-url: ${EMAIL_API_URL:${SPRING_EMAIL_API_API_URL:https://api.mailgun.net/v3}}
    from-email: ${EMAIL_FROM:${SPRING_EMAIL_API_FROM:no-reply@safecity-connect.local}}
    domain: ${EMAIL_DOMAIN:${SPRING_EMAIL_API_DOMAIN:}}

  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8081}

# ─── Application-specific Config ─────────────────────────────────────────────
safecity:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: safecity
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  ai:
    simulation-enabled: ${SAFECITY_AI_SIMULATION:false}
    service-url: ${SAFECITY_AI_SERVICE_URL:http://localhost:8000}
    model: ${SAFECITY_AI_MODEL:openai/clip-vit-base-patch32}
  sla:
    hours: ${SAFECITY_SLA_HOURS:72}
  alerts:
    recipient-email: ${ALERT_RECIPIENT_EMAIL:fersidhia9@gmail.com}
  reports:
    admin-email: ${REPORT_ADMIN_EMAIL:admin1@safecity.local}
    schedule-enabled: ${REPORT_SCHEDULE_ENABLED:true}
    schedule-cron: ${REPORT_SCHEDULE_CRON:0 0 8 * * MON}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    "com.safecity": DEBUG
    "org.springframework.security": INFO
