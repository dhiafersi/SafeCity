name: safecity_mobile
description: A mobile SafeCity frontend for iOS and Android.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  http: ^1.6.0
  network_info_plus: ^4.0.3
  flutter_secure_storage: ^10.2.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  image_picker: ^1.2.2
  geolocator: ^10.0.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/