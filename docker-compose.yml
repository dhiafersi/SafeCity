services:
  # ─────────────────────────────── PostgreSQL + PostGIS ───────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safecity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safecity_db
      POSTGRES_USER: safecity_user
      POSTGRES_PASSWORD: safecity_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safecity_user -d safecity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safecity-net

  # ─────────────────────────────── Keycloak ───────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: safecity-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/safecity_db
      KC_DB_USERNAME: safecity_user
      KC_DB_PASSWORD: safecity_pass
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safecity-net

  # ─────────────────────────────── Spring Boot Backend ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safecity-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/safecity_db
      SPRING_DATASOURCE_USERNAME: safecity_user
      SPRING_DATASOURCE_PASSWORD: safecity_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/safecity
      KEYCLOAK_BASE_URL: http://keycloak:8080
      SERVER_PORT: 8081
      HUGGING_FACE_TOKEN: ${HUGGING_FACE_TOKEN:-}
      SAFECITY_AI_SIMULATION: ${SAFECITY_AI_SIMULATION:-false}
      SAFECITY_AI_SERVICE_URL: ${SAFECITY_AI_SERVICE_URL:-http://ai-service:8000}
      EMAIL_API_PROVIDER: ${EMAIL_API_PROVIDER:-smtp}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-https://api.mailgun.net/v3}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-your-mailgun-domain}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@safecity-connect.local}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-ab75a7001@smtp-brevo.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-kjhXYmnxv03HAc6Z}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safecity-net

  # ─────────────────────────────── Python AI Microservice ─────────────────────
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: safecity-ai-service
    environment:
      AI_MODEL_PATH: ${AI_MODEL_PATH:-/app/runs/best.pt}
      AI_MODEL_CONFIDENCE: ${AI_MODEL_CONFIDENCE:-0.25}
    ports:
      - "8000:8000"
    networks:
      - safecity-net
    volumes:
      - ./backend/ai-service:/app

  # ─────────────────────────────── Angular Frontend ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safecity-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - safecity-net

volumes:
  postgres_data:
  safecity_uploads:

networks:
  safecity-net:
    driver: bridge
